name: Budapest Radar – napi programfigyelés
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 12 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 16 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 20 * * *'
      timezone: 'Europe/Budapest'

permissions:
  contents: write

concurrency:
  group: budapest-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Friss programhírek keresése
        run: |
          python scripts/refresh_events.py
          python scripts/refresh_concerts.py
          python scripts/refresh_vienna.py
          python scripts/refresh_topics.py
          python scripts/refresh_official.py
      - name: Eseménylinkek és adatminőség ellenőrzése
        run: |
          python scripts/audit_links.py
          python -m py_compile scripts/refresh_vienna.py scripts/refresh_topics.py scripts/refresh_official.py
      - name: Változások mentése
        run: |
          if ! git diff --quiet -- events.json concerts.json vienna-events.json vienna-concerts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json concerts.json vienna-events.json vienna-concerts.json
            git commit -m "Refresh and audit Budapest Radar event links"
            git push
          else
            echo "Nincs változás."
          fi
