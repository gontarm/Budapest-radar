name: Budapest Radar – napi programfigyelés
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cinema.py'
      - 'scripts/radar_health.py'
      - 'scripts/refresh_direct_calendars.py'
      - 'scripts/test_direct_calendars.py'
      - 'scripts/test_cinema.py'
      - 'scripts/refresh_classical.py'
      - 'scripts/test_classical.py'
      - 'scripts/refresh_niche_sources.py'
      - 'scripts/test_niche_sources.py'
      - 'scripts/enrich_event_details.py'
      - 'scripts/test_enrich_event_details.py'
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 12 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 16 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 20 * * *'
      timezone: 'Europe/Budapest'

permissions:
  contents: write

concurrency:
  group: budapest-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML-feldolgozó telepítése
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Python adatgyűjtők ellenőrzése
        run: python -m py_compile scripts/refresh_events.py scripts/refresh_concerts.py scripts/refresh_vienna.py scripts/refresh_topics.py scripts/refresh_official.py scripts/refresh_theatre.py scripts/refresh_theatre_network.py scripts/refresh_food.py scripts/refresh_cinema.py scripts/refresh_direct_calendars.py scripts/refresh_classical.py scripts/refresh_niche_sources.py scripts/enrich_event_details.py
      - name: Színházi és mozis feldolgozók tesztelése
        run: |
          python scripts/test_theatre.py
          python scripts/test_cinema.py
          python scripts/test_direct_calendars.py
          python scripts/test_classical.py
          python scripts/test_niche_sources.py
          python scripts/test_enrich_event_details.py
      - name: Programforrások frissítése – egymástól függetlenül
        shell: bash
        run: |
          set +e
          failed=0
          for script in refresh_events refresh_concerts refresh_classical refresh_vienna refresh_topics refresh_official refresh_theatre refresh_theatre_network refresh_food refresh_cinema refresh_direct_calendars refresh_niche_sources; do
            echo "::group::Gyűjtő: ${script}"
            python -u "scripts/${script}.py"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::warning title=Gyűjtőhiba::${script}.py hibával leállt (exit ${code}); a többi gyűjtő folytatódik."
              failed=$((failed+1))
            fi
          done
          echo "Sikertelen gyűjtők: ${failed}/12" >> "$GITHUB_STEP_SUMMARY"
          echo "RADAR_COLLECTOR_FAILURES=${failed}" >> "$GITHUB_ENV"
          echo "A hibás forrás korábban eltárolt eseményeit nem töröljük."
      - name: Hivatalos leírások és eredeti eseményképek begyűjtése
        run: python -u scripts/enrich_event_details.py

      - name: Lejárt automatikus vetítések eltávolítása és frissességi jelentés
        run: python scripts/radar_health.py --prune --summary

      - name: Adatok épségének vizsgálata és hivatkozások ellenőrzése
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("events.json","concerts.json","vienna-events.json","vienna-concerts.json"):
              rows=json.loads(Path(name).read_text(encoding="utf-8"))
              if not isinstance(rows,list):
                  raise ValueError(f"{name}: nem eseménylista")
              print(f"{name}: {len(rows)} bejegyzés")
          PY
          python scripts/audit_links.py || echo "::warning title=Linkellenőrzés::A linkaudit nem teljesült, az eseménylistákat megtartjuk."
      - name: Változások mentése
        run: |
          if ! git diff --quiet -- events.json concerts.json vienna-events.json vienna-concerts.json food_candidates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json concerts.json vienna-events.json vienna-concerts.json food_candidates.json
            git commit -m "Refresh and audit Budapest Radar event links"
            # Manual edits during a long fetch can move main. Rebase the generated
            # commit onto the newest main before pushing; retry on racing pushes.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "A programadatok mentése sikeres."
                exit 0
              fi
              echo "::warning title=GitHub módosult::Új módosítás került a main ágra; újrapróbálkozás ($attempt/3)."
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "::error title=Ütköző adatváltozás::A frissítés nem írja felül az ütköző módosításokat."
                exit 1
              fi
            done
            echo "::error title=Mentés sikertelen::Három próbálkozás után sem sikerült a push."
            exit 1
          else
            echo "Nincs változás."
          fi
      - name: Részleges adatgyűjtési hibák jelzése
        if: always()
        shell: bash
        run: |
          if [ "${RADAR_COLLECTOR_FAILURES:-0}" -gt 0 ]; then
            echo "::error title=Nem teljes frissítés::${RADAR_COLLECTOR_FAILURES} adatgyűjtő hibás volt. A korábbi érvényes adatok megmaradtak."
            exit 1
          fi
