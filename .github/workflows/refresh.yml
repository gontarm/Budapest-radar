name: Budapest Radar – napi programfigyelés
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 12 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 16 * * *'
      timezone: 'Europe/Budapest'
    - cron: '17 20 * * *'
      timezone: 'Europe/Budapest'

permissions:
  contents: write

concurrency:
  group: budapest-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML-feldolgozó telepítése
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Python adatgyűjtők ellenőrzése
        run: python -m py_compile scripts/refresh_events.py scripts/refresh_concerts.py scripts/refresh_vienna.py scripts/refresh_topics.py scripts/refresh_official.py scripts/refresh_theatre.py
      - name: Programforrások frissítése – egymástól függetlenül
        shell: bash
        run: |
          set +e
          failed=0
          for script in refresh_events refresh_concerts refresh_vienna refresh_topics refresh_official refresh_theatre; do
            echo "::group::Gyűjtő: ${script}"
            python -u "scripts/${script}.py"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::warning title=Gyűjtőhiba::${script}.py hibával leállt (exit ${code}); a többi gyűjtő folytatódik."
              failed=$((failed+1))
            fi
          done
          echo "Sikertelen gyűjtők: ${failed}/6" >> "$GITHUB_STEP_SUMMARY"
          echo "A hibás forrás korábban eltárolt eseményeit nem töröljük."
      - name: Adatok épségének vizsgálata és hivatkozások ellenőrzése
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("events.json","concerts.json","vienna-events.json","vienna-concerts.json"):
              rows=json.loads(Path(name).read_text(encoding="utf-8"))
              if not isinstance(rows,list):
                  raise ValueError(f"{name}: nem eseménylista")
              print(f"{name}: {len(rows)} bejegyzés")
          PY
          python scripts/audit_links.py || echo "::warning title=Linkellenőrzés::A linkaudit nem teljesült, az eseménylistákat megtartjuk."
      - name: Változások mentése
        run: |
          if ! git diff --quiet -- events.json concerts.json vienna-events.json vienna-concerts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json concerts.json vienna-events.json vienna-concerts.json
            git commit -m "Refresh and audit Budapest Radar event links"
            git push
          else
            echo "Nincs változás."
          fi
